name: Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_FILE: app/cahier-de-bord.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode Keystore
        run: mkdir -p android/app && echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/cahier-de-bord.jks

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release Signee
        run: ./android/gradlew -p android assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cahier-de-Bord-Numerique-APK
          path: android/app/build/outputs/apk/release/app-release.apk
