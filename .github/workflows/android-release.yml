name: Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Creer Nouveau Keystore
        run: |
          keytool -genkeypair -v -keystore mykey.jks -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Cahier de Bord, OU=App, O=Cahier, L=Hounde, ST=Tuy, C=BF"

      - name: Build Release Non Signe
        run: gradle assembleRelease

      - name: Signer APK
        run: |
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks mykey.jks --ks-key-alias mykey --ks-pass pass:123456 --key-pass pass:123456 --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-aligned.apk
          $BUILD_TOOLS/apksigner verify app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cahier-de-Bord-Numerique-APK
          path: app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload Keystore IMPORTANT A GARDER
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-A-GARDER
          path: mykey.jks
